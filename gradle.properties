org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP registers its generated sources through kotlin.sourceSets, which built-in
# Kotlin (AGP 9 default) otherwise rejects. This is the documented escape hatch
# until KSP talks to the android.sourceSets DSL directly.
android.disallowKotlinSourceSets=false

kotlin.code.style=official